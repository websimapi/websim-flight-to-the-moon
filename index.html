<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flight to the Moon</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="ui-container">
        <div id="altitude-display">Altitude: 0 ft</div>
        <div id="character-selection">
            <h1>Select Your Bird</h1>
            <div class="char-options">
                <div class="char-option" data-bird="sparrow">
                    <img src="sparrow.png" alt="Sparrow">
                    <h2>Sparrow</h2>
                    <p>Balanced flight</p>
                </div>
                <div class="char-option" data-bird="eagle">
                    <img src="eagle.png" alt="Eagle">
                    <h2>Eagle</h2>
                    <p>Fast ascent, slow turns</p>
                </div>
                <div class="char-option" data-bird="hummingbird">
                    <img src="hummingbird.png" alt="Hummingbird">
                    <h2>Hummingbird</h2>
                    <p>Slow ascent, fast turns</p>
                </div>
            </div>
        </div>
        <div id="game-over-screen">
            <h1>Game Over</h1>
            <p>You flew <span id="final-altitude">0</span> ft.</p>
            <button id="restart-button">Try Again</button>
        </div>
         <div id="win-screen">
            <h1>You Reached the Moon!</h1>
            <p>Congratulations!</p>
            <button id="play-again-button">Play Again</button>
        </div>
    </div>
    <canvas id="game-canvas"></canvas>
    <script type="module" src="main.js"></script>

</body>
</html>
